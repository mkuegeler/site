name: Deploy static site to IONOS via SFTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build and export static site
        run: npm run build && npm run export

      - name: SFTP Deploy
        uses: py-actions/sftp-deploy@v1.6.1
        with:
          host: ${{ secrets.SFTP_SERVER }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: ./michael-mkuegeler-blog/out/*
          remote_path: ${{ secrets.SFTP_TARGET }}
          # Optional: remove files on remote not in local
          delete_remote_files: true
