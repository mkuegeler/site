name: Deploy Static Website

on:
  push:
    branches:
      - main  # Trigger this workflow on pushes to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Step 1: Check out your repository code
      - name: SFTP Deploy
        uses: wlix/sftp-deploy-action@v2
        with:
          host: ${{ secrets.SFTP_SERVER }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: ./michael-mkuegeler-blog/out/*
          remote_path: ${{ secrets.SFTP_TARGET }}
          # Optional: remove files on remote not in local
          delete_remote_files: true
